[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edutap.admin_auth"
version = "0.1.0"
description = "Person authentication and per-route permission checks for eduTAP admin APIs"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "EUPL-1.2"
authors = [{ name = "eduTAP" }]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    # Never imported by this package. `fastapi.testclient` needs an HTTP client, and
    # starlette 1.3 takes `httpx2` in preference to `httpx`, warning whenever it has
    # to fall back to the latter. Listing it here keeps that fallback -- and its
    # deprecation warning -- out of the test run.
    "httpx2>=2.9",
    "pdbp",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.16,<0.17",
    "ty",
]
docs = ["myst-parser", "sphinx>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/edutap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "D", "S"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# B008: `Depends(...)` in argument defaults is FastAPI's idiom, not a smell.
# S106: the "hardcoded passwords" are test fixtures for the basic backend.
"tests/*" = ["D", "S101", "S106", "B008"]
