[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edutap.admin_auth"
version = "0.1.0"
description = "Person authentication and per-route permission checks for eduTAP admin APIs"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "EUPL-1.2"
authors = [{ name = "eduTAP" }]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# The federated sign-ins this library's `federated_backend` wraps. Direct git
# references pinned to commits: both packages are public on GitHub but not on
# PyPI, and they carry no tags yet -- move the pin when they do. The SAML SP
# additionally shells out to the `xmlsec1` system tool at runtime.
saml = [
    "fastapi-auth-saml-federated @ git+https://github.com/edutap-collective/fastapi-auth-saml-federated@22f5ff915daf993fce7871d81c608758270cb942",
]
oidc = [
    "fastapi-auth-openid-federated @ git+https://github.com/edutap-collective/fastapi-auth-openid-federated@a363b3edfb4d251f1956bb92ec3f318bcc468067",
]
dev = [
    # The suite exercises `federated_backend` against the real federated
    # identity models, not just fakes. Only the OIDC package though: the two
    # extras cannot share a venv today -- joserfc>=1.7 (OIDC) needs
    # cryptography>=45 while pysaml2 (SAML) caps pyopenssl below 24.3, which
    # caps cryptography below 44. The SAML model test skips where its import
    # is absent; run it in a venv installed with `.[saml]` alone.
    "edutap.admin_auth[oidc]",
    # Never imported by this package. `fastapi.testclient` needs an HTTP client, and
    # starlette 1.3 takes `httpx2` in preference to `httpx`, warning whenever it has
    # to fall back to the latter. Listing it here keeps that fallback -- and its
    # deprecation warning -- out of the test run.
    "httpx2>=2.9",
    "pdbp",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.16,<0.17",
    "ty",
]
docs = ["myst-parser", "sphinx>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/edutap"]

[tool.hatch.metadata]
# Required by hatchling for the two direct references (git URLs, not PyPI names)
# in the optional dependencies above. This package is not published to PyPI
# itself, so the restriction direct references normally exist to enforce there
# does not apply.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "D", "S"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# B008: `Depends(...)` in argument defaults is FastAPI's idiom, not a smell.
# S106: the "hardcoded passwords" are test fixtures for the basic backend.
"tests/*" = ["D", "S101", "S106", "B008"]
